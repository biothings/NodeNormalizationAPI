name: nodenorm
services:
  nodenorm:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
      args:
        - NODENORM_REPO=https://github.com/biothings/NodeNormalizationAPI.git
        - NODENORM_BRANCH=main
    container_name: nodenorm
    ports:
      - 9000:8000  # Caddy listens on 8000 inside the container
